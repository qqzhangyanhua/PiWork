[package]
name = "piwork"
version = "0.1.0"
description = "Local-first AI work desktop application"
edition = "2024"
publish = false

[lints.rust]
linker_messages = "allow"

[lib]
name = "piwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "piwork"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
mail-parser = "0.11.7"
native-tls = "0.2"
piwork-document-runtime-protocol = { path = "document-runtime-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-native-tls = "0.3.1"
ts-rs = { version = "11", features = ["chrono-impl", "uuid-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
