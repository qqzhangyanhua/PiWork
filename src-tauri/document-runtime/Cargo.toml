[package]
name = "piwork-document-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
strip = true

[dependencies]
piwork-document-runtime-protocol = { path = "../document-runtime-protocol" }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time"] }
xberg = { version = "1.0.5", default-features = false, features = ["tokio-runtime", "pdf", "office", "excel", "ocr", "bundle-tessdata-eng"] }
